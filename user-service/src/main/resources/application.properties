server.port=8082

# H2 file-based database for self-contained environment
spring.datasource.url=jdbc:h2:file:./data/user-db;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

spring.application.name=user-service
# (Service discovery removed for simplified self-contained setup)