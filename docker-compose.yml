version: "3.9"
services:
  discovery-service:
    build:
      context: ./discovery-service
    container_name: discovery-service
    ports:
      - "8084:8084"
    environment:
      - JAVA_OPTS=
    networks: [scnet]

  inventory-service:
    build:
      context: ./inventory-service
    container_name: inventory-service
    depends_on:
      - discovery-service
    environment:
      - EUREKA_URL=http://discovery-service:8084/eureka
      - JAVA_OPTS=
    ports:
      - "8081:8081"
    networks: [scnet]
    volumes:
      - inventory-data:/app/data

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    depends_on:
      - discovery-service
    environment:
      - EUREKA_URL=http://discovery-service:8084/eureka
      - JAVA_OPTS=
    ports:
      - "8082:8082"
    networks: [scnet]
    volumes:
      - user-data:/app/data

  cart-service:
    build:
      context: ./cart-service
    container_name: cart-service
    depends_on:
      - discovery-service
    environment:
      - EUREKA_URL=http://discovery-service:8084/eureka
      - JAVA_OPTS=
    ports:
      - "8083:8083"
    networks: [scnet]
    volumes:
      - cart-data:/app/data

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    depends_on:
      - discovery-service
      - inventory-service
      - user-service
      - cart-service
    environment:
      - EUREKA_URL=http://discovery-service:8084/eureka
      - JAVA_OPTS=
    ports:
      - "8080:8080"
    networks: [scnet]

volumes:
  inventory-data:
  user-data:
  cart-data:

networks:
  scnet:
    driver: bridge
