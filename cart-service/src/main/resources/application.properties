server.port=8083

# H2 file-based database for self-contained environment
spring.datasource.url=jdbc:h2:file:./data/cart-db;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

spring.application.name=cart-service
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8084/eureka}
