server.port=8081

# H2 file-based database (persists in ./data directory) for self-contained environment
spring.datasource.url=jdbc:h2:file:./data/inventory-db;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.h2.console.enabled=true

spring.application.name=inventory-service
# (Service discovery removed for simplified self-contained setup)
