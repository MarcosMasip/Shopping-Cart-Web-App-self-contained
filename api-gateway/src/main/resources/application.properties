spring.application.name=api-gateway

# Phase 1 stabilization: disable Eureka participation to remove failing 8761 lookups.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
# (Retained for future re-enable) eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8084/eureka}

# Direct routes (no load-balancing) pointing to fixed service ports.
spring.cloud.gateway.routes[0].id=inventory-direct
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/items/**

spring.cloud.gateway.routes[1].id=cart-direct
spring.cloud.gateway.routes[1].uri=http://localhost:8083
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/cart-items/**

spring.cloud.gateway.routes[2].id=user-direct
spring.cloud.gateway.routes[2].uri=http://localhost:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/users/**

# (Discovery UI route removed while Eureka disabled)




